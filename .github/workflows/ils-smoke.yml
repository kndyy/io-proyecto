name: IO1 C++20 smoke and benchmark
on:
  push:
    branches:
      - feature/ils-agv-integrated
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - selector.conf
      - .github/workflows/ils-smoke.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic main.cpp -o io1
      - name: Verify existing model
        run: ./io1 --self-test
      - name: Run integrated on small, medium and large instances
        run: |
          for n in 01 06 10; do
            ./io1 --input "instances/instancia_${n}.io1" --strategy integrated --seed 20261109 --max-evals 300 --max-neighbors 20 --txt "/tmp/io1_${n}.txt"
            python3 tools/validate_txt.py "instances/instancia_${n}.io1" "/tmp/io1_${n}.txt"
          done
      - name: Run 10-instance integrated benchmark
        run: |
          mkdir -p results
          : > results/integrated_benchmark.log
          for n in 01 02 03 04 05 06 07 08 09 10; do
            ./io1 --input "instances/instancia_${n}.io1" --strategy integrated --seed 20261109 --max-evals 50000 --max-neighbors 120 --txt "/tmp/io1_${n}.txt" | tee -a results/integrated_benchmark.log
            python3 tools/validate_txt.py "instances/instancia_${n}.io1" "/tmp/io1_${n}.txt"
          done
      - name: Save benchmark to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/integrated_benchmark.log
          git diff --staged --quiet || git commit -m "Record integrated solver benchmark across 10 official instances"
          git fetch origin feature/ils-agv-integrated
          git rebase origin/feature/ils-agv-integrated
          git push origin HEAD:feature/ils-agv-integrated
