name: IO1 deep phase-bucket benchmark
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase-deep.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic main.cpp -o io1
          ./io1 --self-test
      - name: Benchmark 50000 evaluation budget
        run: python3 tools/phase_monitor.py --evals 50000 --neighbors 120 --seed 20261109 --out monitor_deep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-deep-${{ github.run_number }}
          path: |
            monitor_deep/summary.csv
            monitor_deep/*_phase-bucket.txt
          retention-days: 30
